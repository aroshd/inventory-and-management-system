function login(){return `<div class="lw"><div class="lt">${thBtn()}${lgb()}</div><div class="lc"><div class="ll"><img src="${LOGO}" alt="Hiroshan Concrete"></div><div class="lr"><h2>${L("Welcome back","සාදරයෙන් පිළිගන්නවා")}</h2><p>${L("Sign in to Hiroshan Concrete Sales & Stock","Hiroshan Concrete විකුණුම් සහ තොග පද්ධතියට ඇතුල් වන්න")}</p><label>${L("Role","භූමිකාව")}</label><div class="rs">${[["cashier",L("Cashier","කැෂියර්")],["manager",L("Manager","කළමනාකරු")],["owner",L("Owner","හිමිකරු")]].map(x=>`<button data-r="${x[0]}" class="${lrole==x[0]?'on':''}" onclick="pickRole('${x[0]}')">${x[1]}</button>`).join("")}</div><label>PIN</label><div class="pin"><input id="l_p" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key=='Enter')doLogin()"></div><button class="lb" onclick="doLogin()">${L("Sign in","ඇතුල් වන්න")}</button>${offline?`<div class="warn" style="margin-top:14px">${L("Database not connected: data lasts for this session only.","දත්ත ගබඩාව සම්බන්ධ නැත: මේ සැසියට පමණක් දත්ත තැබේ.")}</div>`:""}</div></div></div>`}
function doLogin(){const r=lrole,p=$("#l_p").value,k={cashier:CFG.cashPin,manager:CFG.mgrPin,owner:CFG.ownPin}[r];
  if(p!==k){toast(L("Wrong PIN","PIN අංකය වැරදියි"));return}role=r;page=NAV.find(can)||"sale";cart=[];render()}
function shell(){
  const low=P.filter(p=>p.good<=(p.min||0)),rl={cashier:L("Cashier","කැෂියර්"),manager:L("Manager","කළමනාකරු"),owner:L("Owner","හිමිකරු")}[role];
  const nav=NAV.filter(can).map(p=>`<button class="nav ${p==page?'on':''}" onclick="goTo('${p}')">${ico(p)}<span>${L(...PG[p])}</span>${SOON.includes(p)?`<em>${L("Soon","ඉක්මනින්")}</em>`:""}</button>`).join("")+`<button class="nav" onclick="signOut()">${ico("logout")}<span>${L("Logout","පිටවන්න")}</span></button>`;
  const fn=({dash,sale,hist,exp:expP,inv,dmg,sup:supP,cats:catsP,items:itemsP,acct:acctP,rep:repP,branch:branchP,backup:backupP,roles,cust:soonP,tax:soonP,emp:empP})[page]||dash;
  return `<div class="top"><button class="hb" onclick="toggleMenu()">&#9776;</button><img class="lgi" src="${LOGOI}" alt=""><div class="brand">Hiroshan Concrete<small>${L("Smart sales & stock","විකුණුම් සහ තොග පද්ධතිය")}</small></div><div class="srch">${SSV}<input id="gs" autocomplete="off" value="${esc(gsq)}" placeholder="${L("Search items, pages...","අයිතම, පිටු සොයන්න...")}" oninput="gsug(this.value)" onfocus="gsug(this.value)" onblur="setTimeout(gsClose,180)" onkeydown="gsKey(event)"><div id="gsd" class="gsd"></div></div><div style="flex:1"></div><div class="pill">${CSV}${tk()}</div>${thBtn()}${lgb()}
  <div style="position:relative"><button class="ib" onclick="toggleBell()">${ico("bell")}${low.length?`<b class="bd">${low.length}</b>`:""}</button>${nopen?`<div class="dd"><b>${L("Low stock alerts","තොගය අඩු අයිතම")}</b>${low.map(p=>`<div style="padding:5px 0;border-bottom:1px solid var(--bd)">${p.name} <span class="low">${p.good}</span></div>`).join("")||`<div style="padding:6px 0;color:var(--mut)">${L("No alerts","දැනුම්දීම් නැත")}</div>`}</div>`:""}</div>
  <div class="usr2"><span class="av">${(rl||"U")[0]}</span><div><b>${rl}</b><small>${esc(CFG.branch||"Main Branch")}</small></div></div></div>
  <div class="app"><aside class="side ${open?'open':''} ${hid?'hid':''}">${nav}</aside><div class="main"><div class="pg">${offline?`<div class="warn">${L("Database not connected: data lasts for this session only.","දත්ත ගබඩාව සම්බන්ධ නැත.")}</div>`:""}<h2 class="pt">${L(...PG[page])}</h2>${fn()}</div></div></div>`}
/* ---------- helpers ---------- */
const real=()=>S.filter(s=>s.type!="damage");
const sumS=a=>a.reduce((r,s)=>({n:r.n+s.qty,rev:r.rev+s.qty*s.price,pf:r.pf+s.qty*(s.price-s.cost)}),{n:0,rev:0,pf:0});
function from(r){const d=new Date();if(r=="7"||r=="30"){d.setDate(d.getDate()-(+r-1));return tk(d)}if(r=="mtd")return tk().slice(0,7)+"-01";if(r=="ytd")return tk().slice(0,4)+"-01-01";return tk()}
/* ---------- dashboard ---------- */
function dashMain(){
  const f=from(range),R5=real(),m=R5.filter(s=>s.day>=f),mk=tk().slice(0,7)+"-01",td=sumS(R5.filter(s=>s.day==tk())),mo=sumS(R5.filter(s=>s.day>=mk)),low=P.filter(p=>p.good<=(p.min||0)),
  sv=P.reduce((a,p)=>a+lotVal(p)+(p.dmg||0)*(p.dmgPrice||0),0),exm=EXPV().filter(e=>e.day>=mk),ext=exm.reduce((a,e)=>a+e.amount,0),units=P.reduce((a,p)=>a+p.good,0),dmu=P.reduce((a,p)=>a+(p.dmg||0),0);
  const Rg=[["today",L("Today","අද")],["7",L("7 days","දින 7")],["30",L("30 days","දින 30")],["mtd",L("This month","මේ මාසය")],["ytd",L("This year","මේ අවුරුද්ද")]];
  const days={};m.forEach(s=>days[s.day]=(days[s.day]||0)+s.qty*s.price);const dk=Object.keys(days).sort().slice(-14),mx=Math.max(1,...dk.map(k=>days[k]));
  const cr=CATS.map(c=>[c,m.filter(s=>(OLD[s.cat]||s.cat)==c).reduce((a,s)=>a+s.qty*s.price,0)]).filter(x=>x[1]>0),ct=cr.reduce((a,x)=>a+x[1],0),PAL=["#f59e0b","#2563eb","#16a34a","#8b5cf6","#ec4899","#0d9488"];
  let acc=0;const grad=cr.map((x,i)=>{const a=acc/ct*100;acc+=x[1];return `${PAL[i%6]} ${a}% ${acc/ct*100}%`}).join(",");
  const by={};m.forEach(s=>{const o=by[s.name]||(by[s.name]={n:0,r:0});o.n+=s.qty;o.r+=s.qty*s.price});const top=Object.entries(by).sort((a,b)=>b[1].n-a[1].n).slice(0,5);
  const eb={};exm.forEach(e=>{const k=ek(e);eb[k]=(eb[k]||0)+e.amount});const ebs=Object.entries(eb).sort((a,b)=>b[1]-a[1]),emx=Math.max(1,...ebs.map(x=>x[1]));

async function saveItem(id){if(id&&!canEditItem())return;const v=k=>$("#m_"+k)?$("#m_"+k).value:null,n=v("name").trim();if(!n){toast(L("Enter a name","නම ඇතුළත් කරන්න"));return}

  if(cap("cost"))o.cost=+v("cost")||0;else if(o.cost==null)o.cost=0;if(!id)o.good=+v("good")||0;
  if(!id){o.lots=[{id:uid(),sup:o.sup,qty:o.good,cost:o.cost||0,price:o.price}]}else{o.lots=cp(lotsOf(o));const c0=o.lots.find(l=>l.qty>0)||o.lots[0];c0.price=o.price;c0.sup=o.sup;if(cap("cost"))c0.cost=o.cost;syncLots(o)}
  await save("products",id||uid(),o);$("#mo").remove();toast(L("Saved","සුරැකුණා"));render()}

async function breakParts(id){const p=P.find(x=>x.id==id),kids=P.filter(x=>x.parent==id),n=+await askNum(L("How many whole items to break into parts?","කොටස් වලට කඩන්න ඕන සම්පූර්ණ අයිතම ගණන?"));if(!n||n<1||n>p.good){toast(L("Invalid quantity","ගණන වැරදියි"));return}const np=strip(p);lotsTake(np,n);await save("products",id,np);for(const k of kids){const nk=strip(k);lotsAdd(nk,{sup:nk.sup||"",qty:n*(k.per||1),cost:nk.cost||0,price:nk.price||0});await save("products",k.id,nk)}toast(L("Parts added to stock","කොටස් තොගයට එකතු විය"));render()}

async function saveEmp(id,r){const n=$("#m_en").value.trim();if(!n){toast(L("Enter a name","නම ඇතුළත් කරන්න"));return}await save("employees",id||uid(),{name:n,phone:$("#m_ep").value.trim(),note:$("#m_eo").value.trim(),role:r});rmM();toast(L("Saved","සුරැකුණා"));render()}
async function delEmp(id){if(!await askConfirm(L("Delete this person? Past invoices keep the name.","මේ පුද්ගලයා මකන්නද? පරණ බිල්පත් වල නම තබා ගැනේ.")))return;if(db){try{await db.doc("employees/"+id).delete()}catch(e){toast(L("Could not save","සුරැකීමට නොහැකි විය"))}}else EMP=EMP.filter(x=>x.id!=id);render()}

const LOCAL=(()=>{try{return localStorage.getItem("hc_mode")=="local"}catch(e){return false}})();
let pTimer=null,lastSaved=0;
function allData(){return{v:1,t:Date.now(),products:P,sales:S,suppliers:SUP,expenses:EXP,employees:EMP,cfg:{...CFG}}}
function applyData(d){P=d.products||[];S=d.sales||[];SUP=d.suppliers||[];EXP=d.expenses||[];EMP=d.employees||[];if(d.cfg)CFG={...DEF,...d.cfg,perms:{...DEF.perms,...(d.cfg.perms||{})}};loadCats()}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem("hc_local")||"null");if(d)applyData(d)}catch(e){}}
function persistNow(){try{localStorage.setItem("hc_local",JSON.stringify(allData()));lastSaved=Date.now();qBanner()}catch(e){toast(L("Browser storage is full - use Save now","browser ගබඩාව පිරී ඇත - 'දැන් සුරකින්න' භාවිතා කරන්න"))}}
function persistSoon(){clearTimeout(pTimer);pTimer=setTimeout(persistNow,700)}
async function saveNow(){if(LOCAL)persistNow();if(dl){try{await dl.save({filename:"hiroshan-data-"+tk()+".json",data:JSON.stringify(allData())})}catch(e){if(!e||e.code!="declined")toast(L("Download not available","බාගත කළ නොහැක"))}}else toast(L("Saved in this browser","මේ browser එකේ සුරැකුණා"))}
function loadFileM(){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.products)throw 0;if(!await askConfirm(L("Replace the data on this computer with this file?","මේ computer එකේ දත්ත මේ ගොනුවෙන් මාරු කරන්නද?")))return;applyData(d);persistNow();toast(L("Loaded","පූරණය විය"));render()}catch(e){toast(L("Not a valid data file","වලංගු දත්ත ගොනුවක් නොවේ"))}};i.click()}
function setMode(m){if(m==(LOCAL?"local":"cloud"))return;if(m=="local")persistNow();try{localStorage.setItem("hc_mode",m)}catch(e){}toast(L("Switching...","මාරු වෙමින්..."));setTimeout(()=>location.reload(),400)}
async function connectServer(){if(!await askConfirm(L("Upload all data from this computer to the cloud database and switch to Cloud mode? Records with the same ID are overwritten.","මේ computer එකේ සියලු දත්ත cloud database එකට යවලා Cloud ක්‍රමයට මාරු වෙන්නද? එකම අංකය (ID) ඇති වාර්තා උඩින් ලියැවෙනවා.")))return;
  let c=null;try{c=await claude.use("db")}catch(e){}if(!c){toast(L("Cloud database is not available","Cloud database නොමැත"));return}
  try{let n=0;for(const [col,arr] of [["products",P],["sales",S],["suppliers",SUP],["expenses",EXP],["employees",EMP]])for(const r of arr){const d={...r};delete d.id;await c.doc(col+"/"+r.id).set(d);n++}
    await c.doc("settings/cfg").set({...CFG});try{localStorage.setItem("hc_mode","cloud")}catch(e){}toast(L("Uploaded records: ","යැවූ වාර්තා: ")+n);setTimeout(()=>location.reload(),900)}catch(e){toast(L("Upload failed - nothing was switched","යැවීම අසාර්ථකයි - මාරු වුණේ නැහැ"))}}
function storageBox(){
  return `<div class="box"><h3>${L("Data storage","දත්ත ගබඩාව")}</h3><p style="margin-top:0">${L("Current mode","දැන් ඇති ක්‍රමය")}: <b>${LOCAL?L("This computer (local)","මේ computer එක (local)"):L("Cloud database","Cloud database")}</b></p>
  <div class="row"><button class="${LOCAL?'gh':'on'}" onclick="setMode('cloud')">Cloud</button><button class="${LOCAL?'on':'gh'}" onclick="setMode('local')">${L("This computer","මේ computer එක")}</button></div>
  ${LOCAL?`<p style="color:var(--mut)">${L("Data is saved automatically inside this browser on this computer. Do not clear the browser data without saving a backup file.","දත්ත මේ computer එකේ browser එක ඇතුළේ ඉබේම සුරැකෙනවා. උපස්ථ ගොනුවක් සුරකින්නේ නැතිව browser data මකන්න එපා.")}</p>
  <div class="row"><button class="ok" onclick="saveNow()">${L("Save backup file","උපස්ථ ගොනුවක් සුරකින්න")}</button><button class="gh" onclick="loadFileM()">${L("Load from file","ගොනුවකින් පූරණය")}</button></div>
  <hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><b>${L("Connect to server","server එකට සම්බන්ධ කරන්න")}</b><p style="color:var(--mut)">${L("Uploads the data on this computer to the cloud database and switches to Cloud mode so all devices share it.","මේ computer එකේ දත්ත cloud database එකට යවලා, Cloud ක්‍රමයට මාරු කරනවා. එවිට සියලු උපාංග වලට එකම දත්ත පෙනෙනවා.")}</p><button class="ok" onclick="connectServer()">${L("Connect to server","server එකට සම්බන්ධ කරන්න")}</button>`:`<p style="color:var(--mut);margin-bottom:0">${L("Cloud mode: all devices share the same data. Switching to This computer copies the current data to this browser first.","Cloud ක්‍රමය: සියලු උපාංග වලට එකම දත්ත. 'මේ computer එක' වෙත මාරු වෙද්දී දැනට ඇති දත්ත මේ browser එකට පිටපත් වෙනවා.")}</p>`}</div>`}
const canEditItem=()=>cap("edit");
function roles(){return rolesMain()+storageBox()}

let rcv="";
function balTxt(tot){const p=+rcv||0;if(!p)return "";const b=p-tot;return b>=0?L("Balance","ඉතිරි මුදල")+": "+fmt(b):`<span style="color:var(--no)">${L("Short","මදි")}: ${fmt(-b)}</span>`}
function rcvUpd(){const e=$("#bal");if(e)e.innerHTML=balTxt(cart.reduce((a,l)=>a+l.qty*l.price,0))}

let ctabSet=false,itemImg="",topCnt={};
function topItems(){return P.filter(p=>FAV.includes(p.id))}
function pickImg(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=240,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);itemImg=c.toDataURL("image/jpeg",0.72);const pv=$("#m_prev");if(pv){pv.src=itemImg;pv.style.display="block"}};im.onerror=()=>toast(L("Could not read the photo","ඡායාරූපය කියවන්න බැරි විය"));im.src=r.result};r.readAsDataURL(f)}

const lotsOf=p=>Array.isArray(p.lots)&&p.lots.length?p.lots:[{id:"l0",sup:p.sup||"",qty:p.good||0,cost:p.cost||0,price:p.price||0}];
const cp=a=>a.map(l=>({...l}));
function syncLots(np){let ls=np.lots.filter(l=>l.qty>0||np.lots.length==1);if(!ls.length)ls=[np.lots[0]];np.lots=ls;np.good=ls.reduce((a,l)=>a+l.qty,0);const c=ls.find(l=>l.qty>0)||ls[0];np.price=c.price;np.cost=c.cost;np.sup=c.sup}
function lotsTake(np,q,lotId){np.lots=cp(lotsOf(np));let r=q,cost=0;const order=lotId?np.lots.filter(l=>l.id==lotId).concat(np.lots.filter(l=>l.id!=lotId)):np.lots;for(const l of order){if(r<=0)break;const k=Math.min(l.qty,r);l.qty-=k;r-=k;cost+=k*(l.cost||0)}syncLots(np);return q>0?cost/q:0}
function lotsAdd(np,x){np.lots=cp(lotsOf(np));const e=np.lots.find(l=>l.sup==x.sup&&l.price==x.price&&l.cost==x.cost);if(e)e.qty+=x.qty;else np.lots.push({id:uid(),sup:x.sup,qty:x.qty,price:x.price,cost:x.cost});syncLots(np)}
const lotVal=p=>lotsOf(p).reduce((a,l)=>a+l.qty*l.price,0);
function lotsHTML(p){const all=lotsOf(p),ls=all.filter(l=>l.qty>0);if(ls.length<=1)return h2(supName((ls[0]||all[0]).sup));return ls.map(l=>`<div>${h2(supName(l.sup))} <small style="color:var(--mut)">${l.qty}</small></div>`).join("")}
function supText(p){const all=lotsOf(p),ls=all.filter(l=>l.qty>0);return (ls.length>1?ls.map(l=>supName(l.sup)+": "+l.qty):[supName((ls[0]||all[0]).sup)]).join("; ")}
function priceRange(p,k){const v=[...new Set(lotsOf(p).filter(l=>l.qty>0).map(l=>l[k]))].sort((a,b)=>a-b);if(!v.length)return fmt(p[k]);return v.length==1?fmt(v[0]):fmt(v[0])+" - "+fmt(v[v.length-1])}
let lotE="";
function stockM(id,eid){const p=P.find(x=>x.id==id);if(!p)return;lotE=eid||"";const ls=lotsOf(p),e=ls.find(l=>l.id==lotE),cur=ls.find(l=>l.qty>0)||ls[0],f=e||{sup:cur.sup,qty:"",price:cur.price,cost:cur.cost};rmM();
  const d=document.createElement("div");d.className="mo";d.id="mo";
  d.innerHTML=`<div class="md" style="max-width:560px"><h3 style="margin-top:0">${h2(p.name)} - ${L("Stock by supplier","සැපයුම්කරු අනුව තොගය")}</h3><div class="tw"><table><tr><th>${L("Supplier","සැපයුම්කරු")}</th><th>${L("Qty","ගණන")}</th><th>${L("Price","මිල")}</th>${cap("cost")?`<th>${L("Cost","පිරිවැය")}</th>`:""}<th></th></tr>${ls.map(l=>`<tr><td>${h2(supName(l.sup))}</td><td>${l.qty}</td><td>${fmt(l.price)}</td>${cap("cost")?`<td>${fmt(l.cost)}</td>`:""}<td><button class="gh sm" onclick="stockM('${id}','${l.id}')">${L("Edit","සංස්කරණය")}</button>${ls.length>1?` <button class="no sm" onclick="delLot('${id}','${l.id}')">${L("Delete","මකන්න")}</button>`:""}</td></tr>`).join("")}</table></div>
  <h4 style="margin:14px 0 0">${e?L("Edit supplier stock","සැපයුම්කරුගේ තොගය සංස්කරණය"):L("Add stock from a supplier","සැපයුම්කරුගෙන් තොගය එකතු කරන්න")}</h4>
  <label>${L("Supplier","සැපයුම්කරු")}</label><select id="l_s"><option value="">-</option>${SUP.map(s=>`<option value="${s.id}" ${f.sup==s.id?"selected":""}>${h2(s.name)}</option>`).join("")}</select>
  <div class="row"><div class="g"><label>${e?L("Quantity in stock","තොගයේ ඇති ගණන"):L("Quantity added","එකතු කරන ගණන")}</label><input id="l_q" type="number" value="${e?f.qty:""}"></div><div class="g"><label>${L("Selling price","විකුණුම් මිල")}</label><input id="l_p" type="number" value="${f.price}"></div>${cap("cost")?`<div class="g"><label>${L("Cost price","පිරිවැය")}</label><input id="l_c" type="number" value="${f.cost}"></div>`:""}</div>
  <div class="row" style="margin-top:14px"><button class="gh g" onclick="rmM()">${L("Close","වසන්න")}</button>${e?`<button class="gh g" onclick="stockM('${id}')">${L("New entry","අලුත් එකක්")}</button>`:""}<button class="ok g" onclick="saveLot('${id}')">${L("Save","සුරකින්න")}</button></div></div>`;document.body.appendChild(d)}
async function saveLot(id){const q=+$("#l_q").value;if(!(q>=0)||(!lotE&&!(q>0))){toast(L("Invalid quantity","ගණන වැරදියි"));return}const np=strip(P.find(x=>x.id==id));np.lots=cp(lotsOf(np));const sup=$("#l_s").value,price=+$("#l_p").value||0,cc=$("#l_c")?+$("#l_c").value||0:null;
  if(lotE){const l=np.lots.find(x=>x.id==lotE);if(l){l.sup=sup;l.qty=q;l.price=price;if(cc!=null)l.cost=cc}}else{const cost=cc!=null?cc:(np.cost||0),ex=np.lots.find(l=>l.sup==sup&&l.price==price&&l.cost==cost);if(ex)ex.qty+=q;else np.lots.push({id:uid(),sup,qty:q,price,cost})}
  syncLots(np);await save("products",id,np);toast(L("Stock updated","තොගය යාවත්කාලීන විය"));const k=id;lotE="";render();stockM(k)}
async function delLot(id,lid){if(!await askConfirm(L("Delete this supplier stock entry?","මේ සැපයුම්කරුගේ තොග සටහන මකන්නද?")))return;const np=strip(P.find(x=>x.id==id));np.lots=cp(lotsOf(np)).filter(l=>l.id!=lid);if(!np.lots.length)return;syncLots(np);await save("products",id,np);render();stockM(id)}

const CAPS=[["cost","See and enter cost price and profit","පිරිවැය සහ ලාභය බලන්න / ඇතුළත් කරන්න"],["edit","Edit existing sales items","පවතින විකුණුම් අයිතම සංස්කරණය"],["price","Change the selling price at the sale screen","විකුණුම් තිරයේ විකුණුම් මිල වෙනස් කරන්න"],["del","Delete records (e.g. expenses)","වාර්තා මකන්න (උදා: වියදම්)"],["salary","See and record employee salaries","සේවක වැටුප් බලන්න / සටහන් කරන්න"]];
const CAPDEF={manager:{cost:false,edit:true,price:true,del:false,salary:false},cashier:{cost:false,edit:false,price:false,del:false,salary:false}};
const capDef=(r,k)=>k=="edit"&&r=="manager"&&CFG.mgrEditItems===false?false:!!(CAPDEF[r]||{})[k];
const cap=k=>{if(role=="owner")return true;const c=(CFG.caps&&CFG.caps[role])||{};return c[k]!=null?!!c[k]:capDef(role,k)};
async function tc(r,k,on){CFG.caps=CFG.caps||{};CFG.caps[r]={...(CFG.caps[r]||{}),[k]:!!on};await cfgSave();toast(L("Saved","සුරැකුණා"));render()}

const STAR='<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
let FAV=[];try{FAV=JSON.parse(localStorage.getItem("hc_fav")||"[]")}catch(e){FAV=[]}
function toggleFav(id){FAV=FAV.includes(id)?FAV.filter(x=>x!=id):FAV.concat([id]);try{localStorage.setItem("hc_fav",JSON.stringify(FAV))}catch(e){}render()}

const EXPV=()=>EXP.filter(e=>e.cat!="salary"||cap("salary"));
const SALK=[["salary","Salary","වැටුප"],["advance","Advance","අත්තිකාරම"],["bonus","Bonus","බෝනස්"],["ot","Overtime","අතිකාල"]];
let salEmp="";
const catRow=()=>`<div class="row">${allEC().map(c=>`<button class="${expC==c[0]?'on':'gh'}" onclick="selExpCat('${c[0]}')">${L(c[1],c[2])}</button>`).join("")}<button class="gh" onclick="expCatM()">+ ${L("Add category","වර්ගයක් එකතු කරන්න")}</button><button class="no sm" onclick="delExpCat()">${L("Delete this category","මේ වර්ගය මකන්න")}</button></div>`;
function selSalEmp(id){salEmp=id;document.querySelectorAll(".xi button[data-e]").forEach(b=>{const on=b.dataset.e==id;b.classList.toggle("on",on);b.classList.toggle("gh",!on)})}
function paySal(id){expC="salary";salEmp=id;goTo("exp")}
function salBody(){const emps=EMP,list=EXPV().filter(e=>e.cat=="salary"&&rgOk(e.day)),tot=list.reduce((a,e)=>a+e.amount,0);if(!salEmp||!emps.some(x=>x.id==salEmp))salEmp=emps[0]?emps[0].id:"";
  const by={};list.forEach(e=>{const k=e.matName||e.mat;by[k]=(by[k]||0)+e.amount});
  return `<div class="two"><div class="box"><h3>${ecn("salary")} - ${L("Add payment","ගෙවීමක් එකතු කරන්න")}</h3>${emps.length?`<label>${L("Employee","සේවකයා")}</label><div class="row xi">${emps.map(x=>`<button data-e="${x.id}" class="${salEmp==x.id?'on':'gh'} sm" onclick="selSalEmp('${x.id}')">${h2(x.name)}${x.role=="cashier"?" ("+L("Cashier","කැෂියර්")+")":""}</button>`).join("")}</div>
  <div class="row"><div class="g"><label>${L("Payment type","ගෙවීමේ වර්ගය")}</label><select id="s_k">${SALK.map(k=>`<option value="${k[0]}">${L(k[1],k[2])}</option>`).join("")}</select></div><div class="g"><label>${L("For month","මාසය")}</label><input id="s_m" type="month" value="${tk().slice(0,7)}"></div></div>
  <label>${L("Amount (Rs.)","මුදල (රු.)")}</label><input id="s_a" type="number"><label>${L("Date paid","ගෙවූ දිනය")}</label><input id="s_d" type="date" value="${tk()}"><label>${L("Note","සටහන")}</label><input id="s_n"><div style="margin-top:14px"><button class="ok" onclick="addSal()">${L("Save payment","ගෙවීම සුරකින්න")}</button></div>`:`<p style="color:var(--mut)">${L("No employees yet.","සේවකයින් නැත.")} <a href="#" onclick="goTo('emp');return false">${L("Add them in the Employees tab","සේවකයින් පිටුවේ එකතු කරන්න")}</a></p>`}</div>
  <div class="box"><h3>${L("Paid in the selected dates","තෝරපු දින වල ගෙවූ මුදල")}: ${fmt(tot)}</h3><table>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${h2(k)}</td><td>${fmt(v)}</td></tr>`).join("")||`<tr><td>${L("No payments","ගෙවීම් නැත")}</td></tr>`}</table></div></div>
  <div class="box"><div class="tw"><table><tr><th>${L("Date","දිනය")}</th><th>${L("Employee","සේවකයා")}</th><th>${L("Type","වර්ගය")}</th><th>${L("Month","මාසය")}</th><th>${L("Amount","මුදල")}</th><th>${L("Note","සටහන")}</th><th></th></tr>${list.slice(0,100).map(e=>{const k=SALK.find(x=>x[0]==e.kind);return `<tr><td>${e.day}</td><td>${h2(e.matName||"")}</td><td>${k?L(k[1],k[2]):""}</td><td>${e.month||""}</td><td>${fmt(e.amount)}</td><td>${h2(e.note||"")}</td><td>${cap("del")?`<button class="no sm" onclick="delExp('${e.id}')">${L("Delete","මකන්න")}</button>`:""}</td></tr>`}).join("")||`<tr><td colspan="7">${L("No payments","ගෙවීම් නැත")}</td></tr>`}</table></div></div>`}
async function addSal(){const a=+$("#s_a").value;if(!(a>0)){toast(L("Enter the amount","මුදල ඇතුළත් කරන්න"));return}const e=EMP.find(x=>x.id==salEmp);if(!e){toast(L("Select an employee","සේවකයෙක් තෝරන්න"));return}
  await save("expenses",uid(),{ts:Date.now(),day:$("#s_d").value||tk(),cat:"salary",mat:"emp_"+e.id,matName:e.name,empId:e.id,kind:$("#s_k").value,month:$("#s_m").value,qty:0,unit:"",amount:a,sup:"",note:$("#s_n").value.trim()});toast(L("Saved","සුරැකුණා"));render()}
function goTo(p){page=p;open=false;render()}
init();
</script></body></html>
